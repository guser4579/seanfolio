<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>seanfolio - hero mock</title>
<style>
  /* --- tokens copied verbatim from app/globals.css --- */
  :root {
    --title:   #101112;
    --body:    #333333;
    --muted:   #6A6E7B;
    --card:    #FAFAFB;
    --line:    #EAEBEF;
    --paper:   #FFFFFF;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Oxygen, Ubuntu,
            Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --title:   #F2F3F5;
    --body:    #DEE1E7;
    --muted:   #9BA1AD;
    --card:    #1F222A;
    --line:    #2C303A;
    --paper:   #16181D;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--paper); }
  body {
    margin: 0; background: var(--paper); color: var(--body);
    font-family: var(--sans); font-size: 14px; line-height: 20px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  main { flex: 1 1 auto; }

  /* ---------- header ---------- */
  header.site { position: sticky; top: 0; z-index: 50; background: var(--paper); }
  .bar { border-bottom: 1px solid var(--line); }
  .bar-inner {
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .wordmark { font-weight: 600; color: var(--body); text-decoration: none; font-size: 14px; }
  nav.sub { display: flex; gap: 18px; }
  nav.sub a {
    color: var(--muted); text-decoration: none; font-weight: 500;
  }
  nav.sub a:hover { color: var(--title); }
  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; margin: -7px -8px -7px 0;
    border: 0; background: none; cursor: pointer; color: var(--muted);
    border-radius: 999px;
  }
  .theme-toggle:hover { color: var(--title); }
  .theme-toggle svg { width: 20px; height: 20px; display: block; }
  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .icon-moon { display: block; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  /* ---------- case study ---------- */
  main.study { max-width: 680px; margin: 0 auto; padding: 40px 16px 200px; }
  .study h1 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--title); margin: 0 0 4px; }
  .study .meta-line { color: var(--muted); margin: 0; }

  /* share: right-aligned on the meta-line row */
  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .share {
    display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
    background: none; border: 0; padding: 4px 0; margin: 0; cursor: pointer;
    color: var(--muted); font-weight: 500; font-size: 14px; line-height: 20px;
    font-family: inherit;
  }
  .share:hover { color: var(--title); }
  .share:focus-visible { outline: 2px solid var(--title); outline-offset: 2px; border-radius: 4px; }
  .share svg { width: 16px; height: 16px; display: block; }

  /* facts: ONLY change vs live = flex-direction column (was row w/ flex-wrap) */
  .facts {
    display: flex; flex-direction: column; gap: 8px 40px;
    margin: 20px 0 0; padding: 14px 0;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .facts > div { min-width: 120px; }
  .facts dt { color: var(--muted); margin: 0; }
  .facts dd { color: var(--title); font-weight: 600; margin: 0; }
</style>
</head>
<body>
  <header class="site">
    <div class="bar">
      <div class="bar-inner"><a class="wordmark" href="#">sean forquer</a></div>
    </div>
    <div class="bar">
      <div class="bar-inner">
        <nav class="sub" aria-label="Breadcrumb"><a href="#">back</a></nav>
        <button class="theme-toggle" type="button" aria-label="Toggle light and dark theme" onclick="toggleTheme()">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8 8 0 1 1 9.8 3.5a6.4 6.4 0 0 0 10.7 10.7z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="study">
    <h1>Flexible design patterns are the best tool for an uncertain future</h1>
    <div class="meta-row">
      <p class="meta-line">$4M+ first-year bookings • Case Study • 2026</p>
      <button class="share" type="button" aria-label="Share this case study">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" x2="12" y1="2" y2="15"/>
        </svg>
        share
      </button>
    </div>

    <dl class="facts">
      <div>
        <dt>Company</dt>
        <dd>Foxen</dd>
      </div>
      <div>
        <dt>Role</dt>
        <dd>Sole Product Designer</dd>
      </div>
      <div>
        <dt>Year</dt>
        <dd>2025 - 2026</dd>
      </div>
    </dl>
  </main>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('folio-theme');
        if (!t) { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
    function toggleTheme() {
      var el = document.documentElement;
      var next = el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      el.setAttribute('data-theme', next);
      try { localStorage.setItem('folio-theme', next); } catch (e) {}
    }
  </script>
</body>
</html>
